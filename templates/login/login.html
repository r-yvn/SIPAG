{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPAG - Login</title>
    <!-- Google Fonts: Montserrat & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600..900;1,600..900&family=Poppins:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

    <main class="login-page">
        <!-- Back Navigation Button -->
        <div class="back-nav">
            <a href="{% url 'landing' %}" class="back-link">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 14L4 9l5-5"/>
                    <path d="M4 9h11a5 5 0 0 1 5 5v2"/>
                </svg>
                <span>Back to Main Page</span>
            </a>
        </div>

        <!-- Center Login Modal -->
        <div class="login-card">
            <!-- SIPAG Logo -->
            <img src="{% static 'images/core/app_logo.png' %}" alt="SIPAG Logo" class="app-logo">

            <!-- Card Headline -->
            <h1 class="card-title">Welcome Back User</h1>

            <!-- Notifications & Errors -->
            {% if error_message %}
                <div class="alert-error">{{ error_message }}</div>
            {% endif %}
            {% if messages %}
                {% for message in messages %}
                    <div class="{% if message.tags == 'success' %}alert-success{% else %}alert-error{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Login Form -->
            <form method="POST" action="{% url 'login' %}" class="login-form">
                {% csrf_token %}
                <div class="form-group">
                    <input type="text" name="username" class="form-input" placeholder="Input Username" required autofocus>
                </div>

                <div class="form-group">
                    <input type="password" name="password" class="form-input" placeholder="Input Password" required>
                </div>

                <p class="account-prompt">
                    No account? <a href="{% url 'register' %}">Register Now!</a>
                </p>

                <button type="submit" class="btn-submit">Login</button>
            </form>
        </div>
    </main>

</body>
</html>
