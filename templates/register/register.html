{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPAG - Create your Account</title>
    <!-- Google Fonts: Montserrat & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600..900;1,600..900&family=Poppins:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #11282e;
        }

        .register-page {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            background: linear-gradient(rgba(14, 38, 44, 0.68), rgba(14, 38, 44, 0.68)), url("{% static 'images/register/register_background.png' %}");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        /* Top Left Navigation Link */
        .back-nav {
            position: absolute;
            top: 36px;
            left: 45px;
            z-index: 10;
        }

        .back-link {
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.95;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .back-link:hover {
            opacity: 1;
            transform: translateX(-3px);
        }

        /* Center White Modal Card */
        .register-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 760px;
            border-radius: 36px;
            padding: 48px 56px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-logo {
            width: 100%;
            max-width: 270px;
            height: auto;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .card-title {
            font-family: 'Montserrat', sans-serif;
            color: #173f4a;
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: -0.3px;
        }

        /* Alerts */
        .alert-error {
            background-color: #fde8e8;
            color: #c81e1e;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 600;
            width: 100%;
            margin-bottom: 18px;
            text-align: center;
        }

        .alert-success {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 600;
            width: 100%;
            margin-bottom: 18px;
            text-align: center;
        }

        /* Form Grid */
        .register-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 20px;
            width: 100%;
            margin-bottom: 26px;
        }

        .form-input {
            width: 100%;
            height: 52px;
            border-radius: 14px;
            border: 2px solid #57868f;
            padding: 0 20px;
            font-size: 1rem;
            outline: none;
            background-color: #ffffff;
            color: #222222;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-input::placeholder {
            color: #8faab0;
            font-style: italic;
        }

        .form-input:focus {
            border-color: #173f4a;
            box-shadow: 0 0 10px rgba(87, 134, 143, 0.25);
        }

        .btn-submit {
            background-color: #1a515c;
            color: #ffffff;
            border: none;
            width: 240px;
            height: 50px;
            border-radius: 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(26, 81, 92, 0.35);
            transition: background-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-submit:hover {
            background-color: #143e47;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(26, 81, 92, 0.45);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        @media (max-width: 768px) {
            .back-nav {
                top: 24px;
                left: 20px;
            }
            .register-card {
                padding: 40px 24px;
                border-radius: 26px;
            }
            .form-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .btn-submit {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <main class="register-page">
        <!-- Back Navigation Button -->
        <div class="back-nav">
            <a href="{% url 'index' %}" class="back-link">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 14L4 9l5-5"/>
                    <path d="M4 9h11a5 5 0 0 1 5 5v2"/>
                </svg>
                <span>Back to Main Page</span>
            </a>
        </div>

        <!-- Center Register Modal -->
        <div class="register-card">
            <!-- SIPAG Logo -->
            <img src="{% static 'images/core/app_logo.png' %}" alt="SIPAG Logo" class="app-logo">

            <!-- Card Headline -->
            <h1 class="card-title">Create your Account</h1>

            <!-- Notifications & Errors -->
            {% if error_message %}
                <div class="alert-error">{{ error_message }}</div>
            {% endif %}
            {% if messages %}
                {% for message in messages %}
                    <div class="{% if message.tags == 'success' %}alert-success{% else %}alert-error{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Registration Form -->
            <form method="POST" action="{% url 'register' %}" class="register-form">
                {% csrf_token %}
                
                <div class="form-grid">
                    <!-- Row 1: Names -->
                    <input type="text" name="first_name" class="form-input" placeholder="First name (e.g. John)" required autofocus>
                    <input type="text" name="last_name" class="form-input" placeholder="Last name (e.g. Doe)" required>

                    <!-- Row 2: Barangay & Contact Number -->
                    <input type="text" name="barangay" class="form-input" placeholder="Barangay (e.g. Guadalupe)" required>
                    <input type="text" name="contact_number" class="form-input" placeholder="Contact Number" required>

                    <!-- Row 3: Email Address & Password -->
                    <input type="email" name="email" class="form-input" placeholder="Email Address" required>
                    <input type="password" name="password" class="form-input" placeholder="Password" required>
                </div>

                <button type="submit" class="btn-submit">Register</button>
            </form>
        </div>
    </main>

</body>
</html>
