<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        header { background-color: #52d94c; color: #fff; padding: 1rem; text-align: center; }
        nav { display: flex; justify-content: center; background-color: #1ba2f6; }
        nav a { color: white; padding: 14px 20px; text-decoration: none; text-align: center; }
        nav a:hover { background-color: #ddd; color: black; }
        
    </style>
</head>
<body>

    <header>
        <h1>Welcome, {{user.username}}!</h1>
    </header>

    <nav>
        <a href="{% url 'profile' %}">Profile</a>
        <a href="{% url 'user_settings' %}">Settings</a>
        <a href="{% url 'login' %}">Logout</a>
    </nav>

</body>
</html>
