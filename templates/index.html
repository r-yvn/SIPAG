{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPAG - Welcome</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Arial, sans-serif; 
        }

        html, body {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            background-color: #f4f4f4;
        }

        .text-green { color: #52d94c; }
        .text-blue { color: #1ba2f6; }

        .hero-section {
            width: 100vw;
            height: 100vh;
            margin: 0; 
            background-image: url("{% static 'images/welcome.png' %}");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding: 0 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .hero-content { 
            color: #ffffff; 
            max-width: 650px;
        }

        .hero-title { 
            font-size: 2.5rem;
            font-weight: 800; 
            line-height: 1.25; 
            margin-bottom: 16px; 
        }

        .hero-tagline { 
            font-size: 1.15rem;
            margin-bottom: 28px; 
            opacity: 0.95; 
        }

        .btn-pill-green {
            background-color: #52d94c; 
            color: #ffffff; 
            border: none;
            padding: 12px 36px; 
            border-radius: 24px; 
            font-weight: 600;
            font-size: 1rem; 
            text-decoration: none; 
            display: inline-block;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-pill-blue {
            background-color: #1ba2f6; 
            color: #ffffff; 
            border: none;
            padding: 12px 36px;
            border-radius: 24px; 
            font-weight: 600;
            font-size: 1rem; 
            text-decoration: none; 
            display: inline-block; 
            margin-left: 14px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-pill-green:hover, .btn-pill-blue:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">
                System for <span class="text-green">Information Profiling</span><br>
                and <span class="text-green">Administrative Governance</span>
            </h1>
            <p class="hero-tagline">SIPAG: Service that is Constant, Reliable, Accurate, and Transparent</p>
            <div>
                <a href="{% url 'login' %}" class="btn-pill-green">Login</a>
                <a href="{% url 'register' %}" class="btn-pill-blue">Register</a>
            </div>
        </div>
    </section>
</body>
</html>
